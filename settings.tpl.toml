[lightning]
# path to tls.cert file
lnd_cert_file = '/home/user/.polar/networks/1/volumes/lnd/alice/tls.cert'
# path to macaroon file
lnd_macaroon_file = '/home/user/.polar/networks/1/volumes/lnd/alice/data/chain/bitcoin/regtest/admin.macaroon'
# lnd grpc host and port
lnd_grpc_host = 'https://127.0.0.1:10001'
# lightning invoices sent by the buyer to Mostro should have at least
# this expiration time in seconds
invoice_expiration_window = 3600
# Hold invoice cltv delta (expiration time in blocks)
hold_invoice_cltv_delta = 144
# This is the time that a taker has to pay the invoice (seller) or 
# to add a new invoice (buyer), in seconds
hold_invoice_expiration_window = 300
# Retries for failed payments
payment_attempts = 3
# Retries interval for failed payments
payment_retries_interval = 60
# Maximum min_final_cltv_expiry_delta (in blocks) accepted on a payout invoice
# supplied by a user. This is the window in which that payee can hold the
# outgoing HTLC — and the sats behind it — without settling; the node cannot
# cancel a locked-in HTLC, it can only wait out the expiry. 144 blocks (~1
# day) is the top of the range real wallets ask for. Raise it only if a
# legitimate wallet is rejected. Never set it to 0: the check is
# `delta > bound` and BOLT11 substitutes 18 when the invoice omits the
# field, so a 0 bound rejects every invoice.
max_final_cltv_expiry_delta = 144
# Safety margin (in blocks) before the hold invoice's CLTV horizon. LND
# auto-cancels an accepted hold invoice `invoices.holdexpirydelta` blocks
# (default 12) before its HTLC expires, refunding the seller; once the
# chain tip is within escrow_deadline_margin_blocks of the accepted
# HTLC's expiry height (nominal 10-minute-block clock as fallback when
# LND cannot answer), mostrod cancels the trade (Active) or opens a
# dispute (FiatSent) while the escrow still exists. Must comfortably
# exceed your node's holdexpirydelta.
escrow_deadline_margin_blocks = 24
# Ceiling on how many payments the node may have in flight before a new payout
# waits its turn instead of adding another unresolved HTLC. A payee that never
# settles pins the sats, the routing liquidity behind them and an HTLC slot
# until the CLTV expires, and a locked-in HTLC cannot be canceled by the
# sender — so without a ceiling, cheap repeat trades can exhaust the node's
# slots. A gated payout is delayed, never dropped: it goes out on its own once
# the node has room. 0 disables the gate.
max_inflight_payouts = 100
# The same ceiling per payout destination, and the sharper of the two:
# holding an HTLC requires controlling the node that receives it, so the HTLCs
# an abusive payee refuses to settle all share a destination pubkey. Capping
# here prices the attack in funded channels — one more destination node per
# this many held HTLCs — and catches it long before the node-wide cap would.
# Ten simultaneously unresolved payments to one pubkey already means that
# destination is not settling; the benign case it leaves room for is several
# buyers cashing out at once to the same custodial wallet. 0 disables this arm.
max_inflight_payouts_per_destination = 10
# Upper bound (in blocks) on the TOTAL timelock of a payout route, handed to
# LND as `cltv_limit`. max_final_cltv_expiry_delta bounds only the payee's own
# hop; this bounds the whole path, which is what your channel is really locked
# for when a hop force-closes and the HTLC resolves on-chain.
#
# Omit this line and you get 1008. Set it to 0 to send no ceiling at all and
# let your node apply its own --max-cltv-expiry (2016 blocks by default).
#
# Two bounds to respect:
#  - Not above your node's --max-cltv-expiry. LND refuses a larger cltv_limit
#    outright instead of clamping it, so if you lowered that setting below
#    1008, lower this one to match or set it to 0. Until then every payout
#    retries without the ceiling and logs an error.
#  - At least 576 blocks above max_final_cltv_expiry_delta, or there is no room
#    left for a route and honest payouts fail with "no route". A smaller
#    non-zero value is refused and deferred to the node, with an error logged;
#    it is deliberately NOT raised to that floor, since inventing a ceiling
#    could push it past your node's maximum.
payment_cltv_limit = 1008
# Boot guard: mostrod refuses to start against a Lightning node whose
# identity pubkey differs from the one it last ran with while escrow
# (hold invoices, bonds, in-flight payouts) is still open on the old
# node. Drain first (see docs/MAINTENANCE_MODE_LN_MIGRATION.md). Set to
# true ONLY for disaster recovery when the old node is gone for good; it
# knowingly leaves the affected trades unresolved.
allow_node_change = false

[nostr]
nsec_privkey = 'nsec1...'
relays = ['ws://localhost:7000']

[mostro]
# NIP-01 Kind 0 Metadata (optional)
# Human-readable name for this Mostro instance
# name = "Mostro"
# Short description of this Mostro instance
# about = "A peer-to-peer Bitcoin trading daemon over the Lightning Network"
# URL to avatar image (recommended: square, max 128x128px)
# picture = "https://mostro.network/mostro-avatar.png"
# Operator website URL
# website = "https://mostro.network"
# Mostro Fee
fee = 0
# Max routing fee that we want to pay to the network, 0.002 = 0.2%
max_routing_fee = 0.002
# Max order amount (sats)
max_order_amount = 1000000
# Minimum amount for a payment in satoshis
min_payment_amount = 100
# Expiration order hours
expiration_hours = 24
# Max expiration days for an order
max_expiration_days = 15
# Expiration of pending orders
expiration_seconds = 900
# User rate events scheduled time interval
user_rates_sent_interval_seconds = 3600
# Relay list event time interval
publish_relays_interval = 60
# Requested POW
pow = 0
# Anti-spam gate (docs/TRANSPORT_V2_SPEC.md §6 Phase 2). Proof-of-work (leading-zero bits) demanded of a *first-contact*
# event — one whose visible sender (trade key) is not part of an active
# order/dispute — checked BEFORE decryption. Ongoing trades (known keys) need
# only `pow`; brand-new orders/takes from unseen keys must clear this stiffer
# toll. Omit (or leave commented) to fall back to `pow`. Example: keep pow = 0 for cheap ongoing trades but require work
# from first-contact senders.
# pow_first_contact = 16
# How often (seconds) to rebuild the active-trade-pubkey cache the gate
# consults. Lower = a just-taken order's keys fast-path sooner; higher = less
# DB load. Default 60.
# active_pubkeys_refresh_interval = 60
# Publish mostro info interval
publish_mostro_info_interval = 300
# Bitcoin price API base URL.
# DEPRECATED: prefer `[price.providers.yadio].url` in the new multi-source
# `[price]` block below (see docs/PRICE_PROVIDERS.md §10.1). Lifecycle:
#  (a) Now OPTIONAL — once you configure a `[price]` block you may delete this
#      key. When it is absent AND `[price]` is also absent, the default
#      "https://api.yadio.io" is used for the legacy single-source synthesis.
#  (b) Still read by the live market-quote path (/convert) until Phase 4. To
#      avoid the live and cached paths hitting different Yadio URLs, the live
#      path prefers `[price.providers.yadio].url` when a `[price]` block is
#      present and only falls back to this key otherwise.
#  (c) Fully removed in Phase 5.
bitcoin_price_api_url = "https://api.yadio.io"
# Fiat currencies accepted for orders - leave empty [] to accept all fiat currencies
fiat_currencies_accepted = ['USD', 'EUR', 'ARS', 'CUP']
# Maximum orders per response in orders action
max_orders_per_response = 10
# Development sustainability fee
# Percentage of Mostro fee sent to development fund (0.30 means 30% of the Mostro fee)
dev_fee_percentage = 0.30
# Serbero, the dispute assistant (https://github.com/MostroP2P/serbero), if you
# run one: its public key, npub or hex. At startup Mostro registers it as a
# read-only solver (it can talk to the parties but never settle or cancel) and
# announces it in the info event. Mostro refuses to start if this key is a
# write solver, a user that is not a solver, or the node's own key.
# See docs/SOLVER_PERMISSION_LEVELS.md.
# serbero_pubkey = "npub1..."

[database]
url = "sqlite://mostro.db"

# Event expiration configuration
[expiration]
# Order events (kind 38383) - trades resolve quickly
order_days = 30
# Rating events (kind 38384) - reputation history retention
rating_days = 90
# Dispute events (kind 38386) - need longer retention for auditing
dispute_days = 90
# Fee audit events (kind 8383) - annual transparency
fee_audit_days = 365
# Protocol-v2 direct messages (kind 14) - trade lifetime plus dispute window
dm_days = 30

[rpc]
# Enable RPC server for direct admin communication
enabled = false
# RPC server listen address
listen_address = "127.0.0.1"
# RPC server port
port = 50051
# Duration in seconds after which inactive rate-limiter entries are evicted
# rate_limiter_stale_duration = 3600
# Optional shared secret for the mutating admin RPCs (CancelOrder, SettleOrder,
# AddSolver, TakeDispute, SetMaintenanceMode). Clients send it as gRPC
# metadata `authorization: Bearer <token>`. Set it whenever the port is
# reachable through a tunnel, sidecar or non-loopback bind.
# auth_token = ""

# Multi-source price providers (see docs/PRICE_PROVIDERS.md).
# Absent section ≡ legacy single-source behaviour synthesised from
# `[mostro].bitcoin_price_api_url` + `exchange_rates_update_interval_seconds`
# + `publish_exchange_rates_to_nostr`. Uncomment the block to take control.
#
# [price]
# # Poll cadence and freshness budget.
# update_interval_seconds = 300
# max_price_staleness_seconds = 1800
# # Discard a source whose value deviates more than this % from the median
# # (only applies with >= 3 sources for a currency).
# outlier_threshold_pct = 5.0
# # Per-provider request timeout and circuit-breaker (cooldown caps at 30 min).
# provider_timeout_seconds = 10
# provider_failure_threshold = 3
# provider_failure_cooldown_seconds = 120
# # Publish the aggregated rates to Nostr (kind 30078). Replaces the legacy
# # `publish_exchange_rates_to_nostr`.
# publish_to_nostr = true
#
# [price.providers.yadio]
# enabled = true
# url = "https://api.yadio.io"
#
# [price.providers.coingecko]
# enabled = true
# url = "https://api.coingecko.com/api/v3"
# # api_key = "CG-xxxx"   # optional demo/pro key; raises rate limits. Pro
# # plans use url = "https://pro-api.coingecko.com/api/v3" (the adapter picks
# # the matching auth header from the host).
#
# # Keyless, CDN-hosted, 300+ currencies incl. CUP at the OFFICIAL rate — so
# # CUP/MLC are excluded to avoid mixing official with the informal-market
# # sources (docs/PRICE_PROVIDERS.md §6.6).
# [price.providers.currency_api]
# enabled = true
# url = "https://currency-api.pages.dev/v1"
# # Ordered mirrors tried in sequence when `url` fails this tick.
# fallback_urls = ["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1"]
# except = ["CUP", "MLC"]
#
# # Keyless, ~28 major fiats, no CUP/MLC. Mid-market (`last`) only.
# [price.providers.blockchain]
# enabled = true
# url = "https://blockchain.info"
#
# # El Toque — informal-market CUP/MLC (fiat-cross, resolved against the
# # aggregated USD/BTC anchor; §6.3, §11.3). Opt-in: requires a free Bearer
# # token. Scoped to CUP/MLC only — that is all this source contributes.
# # NOTE: the request wiring is PROVISIONAL pending a confirmed payload from
# # the token-gated API — keep `enabled = false` in production until then
# # (see docs/PRICE_PROVIDERS.md §11.3).
# [price.providers.eltoque]
# enabled = false
# url = "https://tasas.eltoque.com"
# # token = "xxxx"        # REQUIRED when enabled; provider refuses to start otherwise
# only = ["CUP", "MLC"]
#
# # Subscribe to prices published (kind 30078) by trusted Mostro nodes over
# # Nostr instead of an HTTP API — for operators in regions where price APIs
# # are DNS/IP blocked (docs/PRICE_PROVIDERS.md §11.7). Reuses the relays
# # already configured in [nostr]; no url needed. With several trusted_nodes,
# # the freshest valid event wins — not a cross-node combine.
# [price.providers.nostr]
# enabled = false
# trusted_nodes = [
#     # hex pubkeys of Mostro nodes you trust to publish accurate rates
# ]

# Anti-abuse bond (issue #711). Opt-in, disabled by default. Uncomment to
# require a Lightning hold-invoice bond from takers and/or makers. See
# docs/ANTI_ABUSE_BOND.md for the full phased rollout.
#
# [anti_abuse_bond]
# enabled = false
# # bond = max(amount_pct * order_amount_sats, base_amount_sats)
# # amount_pct is a unitless fraction (0.01 = 1%); base_amount_sats is a sat floor.
# amount_pct = 0.01
# base_amount_sats = 1000
# # "take" | "make" | "both"
# apply_to = "take"
# # Note: there is no `slash_on_lost_dispute` flag — dispute slashes are
# # solver-directed via the `BondResolution` payload (Phase 2).
# slash_on_waiting_timeout = false
# # Fraction of a slashed bond that the node retains (the rest goes to the
# # winning counterparty). Funds solver compensation for dispute work.
# slash_node_share_pct = 0.5
# payout_invoice_window_seconds = 300
# payout_max_retries = 5
# # Days the winner has to claim their share by submitting a bolt11; after
# # this the bond closes as `forfeited` and the node retains everything.
# payout_claim_window_days = 15
# # Seconds a maker has to pay the maker bond (apply_to = "make" | "both").
# # Past it the unpublished order expires and the maker is told. Must be > 0.
# maker_bond_payment_timeout_seconds = 900

# Payment-account history / anti-triangulation (docs/PAYER_HISTORY_ANTI_TRIANGULATION.md).
# Opt-in, disabled by default. Mostro never sees the buyer's payer details:
# it stores an HMAC, keyed by this node's secret (`nsec_privkey`), of the hash
# the buyer commits to, against the buyer's identity key. Keep the secret out
# of database backups. Changing the node secret discards the stored history on
# the next restart: rows keyed by the old secret can no longer be matched.
#
# [payer_history]
# # Turning this off later keeps the stored history but stops reading and
# # writing it; trades completed while it is off never enter it (docs D-10).
# enabled = false
# # When true, `fiat-sent` is rejected with `payer_not_declared` unless the
# # buyer sent `declare-payer` first. Leave false unless your market relies
# # on sender-verifiable rails only.
# require_declaration = false
# # "Experienced counterparty" thresholds (D-7): a seller qualifies for a
# # buyer's history when, at the moment a trade with that buyer succeeds, it
# # already had >= experienced_min_trades successful, undisputed trades with
# # OTHER buyers ...
# experienced_min_trades = 5
# # ... and its first such trade was >= experienced_min_days days ago.
# experienced_min_days = 30
# # Changing either threshold re-evaluates EVERY stored snapshot under the new
# # pair on the next restart (docs §10.7), so the advertised policy and the
# # stored data never disagree. The change takes effect at restart, not on
# # save.

# Cashu escrow mode (docs/cashu/). Opt-in, disabled by default. When enabled
# the node runs WITHOUT LND and escrows trades in NUT-11 2-of-3 Cashu tokens.
# The maker of each order chooses the mint; the taker accepts it by taking
# the order. Mutually exclusive with [anti_abuse_bond] — enabling both is a
# startup error.
#
# [cashu]
# enabled = false
# # Mints this node accepts for new orders (http/https). Orders on any other
# # mint are rejected. Leave empty ([]) to accept any mint with a public host.
# mint_urls = ["https://mint.example.com", "https://mint.example2.com"]
# # Seller-recovery locktime floor in days: escrow tokens must carry
# # locktime >= now + this. Sellers may set a longer locktime, never shorter.
# escrow_locktime_days = 15

# Reputation import (docs/REPUTATION_PORTABILITY.md). Opt-in, disabled by
# default. Lets users bring reputation earned elsewhere (another Mostro, or
# lnp2pBot) by importing an attestation signed by an issuer listed here.
# Each issuer is a stable local `name` — the key imports are deduplicated on,
# so never rename an entry — with one or more signing keys (npub or hex). To
# follow an issuer's key rotation, add its new key to the same entry and
# remove the old one once its attestations have expired. A key belongs to
# one entry only. The node advertises the keys in its info event.
#
# [reputation_import]
# enabled = false
# # Longest an attestation may live (expiration - created_at), in seconds.
# max_lifetime_seconds = 604800
#
# [[reputation_import.issuers]]
# name = "lnp2pbot"
# keys = ["<lnp2pBot's reputation issuer pubkey>"]
