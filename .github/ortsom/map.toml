# Ortsom e2e gate: which scenarios a pull request runs, chosen by the files
# it touches. Design and semantics: docs/ORTSOM_PR_E2E_SPEC.md § 4.
#
# Every src/**/*.rs and proto/** file must match at least one rule; the
# coverage test in tests/test_map.py fails otherwise. Code Ortsom cannot
# exercise gets a rule with `uncovered = "<reason>"` rather than no rule.
#
# Tags and scenario names are checked against scenarios.json, the
# `ortsom list --json` output of `ortsom_ref`. Bump both in one pull request.

[settings]
# Ortsom revision the gate runs. Bumped by PR, like any dependency.
ortsom_ref = "v0.3.2"
# Run the regtest stack with anti-abuse bonds (`ortsom stack up
# --with-bonds`), so the `bond` scenarios run instead of being skipped.
# Part of a baseline's identity, like `ortsom_ref`: a pull request is only
# compared with baselines measured the same way (§ 7.1).
stack_with_bonds = true
# Tags every non-ignored selection includes.
always_tags = ["smoke"]
# Minimum eligible scenarios for the close verdict to be possible.
min_scenarios = 4
# Regression ratio (regressions / eligible) that triggers the close verdict.
close_ratio = 0.5
# How many first-parent commits back from the merge-base a baseline may be.
baseline_max_distance = 10
# How many recent baselines a scenario must have passed to be "stable".
stability_window = 3

[[rule]]
name = "docs and metadata"
paths = ["**/*.md", "docs/**", "LICENSE"]
ignore = true

[[rule]]
name = "trade flow"
paths = [
  "src/app/take_sell.rs", "src/app/take_buy.rs", "src/app/add_invoice.rs",
  "src/app/fiat_sent.rs", "src/app/release.rs", "src/app/order.rs",
  "src/app/orders.rs", "src/app/dev_fee.rs",
]
tags = ["happy-path"]

[[rule]]
name = "pricing"
paths = ["src/price/**", "src/bitcoin_price.rs"]
scenarios = ["market_price_order", "range_order"]

[[rule]]
name = "maintenance mode"
paths = ["src/app/maintenance.rs", "src/app/daemon_state.rs"]
tags = ["happy-path", "cancellation"]

# The e2e regtest LND is always synced to chain, so these tags exercise the
# sync gate's "synced, don't defer" path and the buyer payout and dev fee
# paths it guards. The unsynced/deferral path and the automatic maintenance
# have no e2e scenario; unit tests cover them.
[[rule]]
name = "health and LND sync gate"
paths = ["src/app/health/**"]
tags = ["happy-path", "payment-failure"]

[[rule]]
name = "cancellation"
paths = ["src/app/cancel.rs"]
tags = ["cancellation"]

[[rule]]
name = "disputes and admin"
paths = ["src/app/dispute.rs", "src/app/admin_*.rs"]
tags = ["dispute"]

[[rule]]
name = "rating"
paths = ["src/app/rate_user.rs"]
scenarios = ["full_trade_with_rating"]

[[rule]]
# Not only expirations: it flushes every outgoing message and runs payment
# retries, payout reconciliation, price updates, dev fee and bond payouts.
name = "scheduler"
paths = ["src/scheduler.rs"]
full = true

[[rule]]
name = "lightning"
paths = ["src/lightning/**"]
tags = ["payment-failure", "happy-path"]

[[rule]]
name = "message intake"
paths = ["src/messages.rs", "src/spam_gate.rs", "src/nip33.rs", "src/util.rs"]
tags = ["adversarial"]

[[rule]]
name = "bonds"
paths = ["src/app/bond/**"]
tags = ["bond"]

[[rule]]
name = "core plumbing"
paths = [
  "src/flow.rs", "src/db.rs", "src/app.rs", "src/main.rs", "src/config/**",
  "src/escrow.rs", "src/app/context.rs", "src/publish.rs",
  "migrations/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml",
]
full = true

[[rule]]
name = "admin RPC"
paths = ["src/rpc/**", "proto/**"]
uncovered = "ortsom has no gRPC client; admin actions it exercises go over Nostr (see the dispute rule)"

[[rule]]
name = "reputation portability"
paths = ["src/app/reputation/**"]
uncovered = "ortsom has no reputation scenario; covered by unit tests and the two-daemon run in #1027"

[[rule]]
name = "cashu"
paths = ["src/cashu/**", "src/app/add_cashu_escrow.rs"]
uncovered = "covered by cashu.yml, not by ortsom"

[[rule]]
name = "serbero boot registration"
paths = ["src/app/serbero.rs"]
uncovered = "runs only when serbero_pubkey is set, which the ortsom stack does not do; covered by unit tests in src/app/serbero.rs"

[[rule]]
name = "payer history"
paths = ["src/app/payer/**", "src/app/release_payer_tests.rs"]
uncovered = "opt-in [payer_history] is off in the ortsom stack and no ortsom scenario declares a payer; covered by unit tests in src/app/payer and the fiat_sent / release tests"

[[rule]]
name = "session restore and key bookkeeping"
paths = [
  "src/app/restore_session.rs", "src/app/last_trade_index.rs", "src/app/trade_pubkey.rs",
  "src/app/user_info.rs",
]
uncovered = "no ortsom scenario yet"

[[rule]]
name = "misc daemon entry points"
paths = ["src/cli.rs", "src/lnurl.rs"]
uncovered = "no ortsom scenario yet (the stack pays bolt11 invoices, never LNURL)"

# --- Money paths (§ 15) -------------------------------------------------------
#
# Code that moves or locks sats. A pull request that touches one may merge
# only with `ortsom:pass` (the `ortsom/money-path` status, required by branch
# protection) and an approving review from a code owner other than its
# author (.github/CODEOWNERS lists the same paths; tests/test_map.py checks
# they agree).

[money_path]
paths = [
  "src/lightning/**", "src/app/bond/**", "src/app/release.rs", "src/app/add_invoice.rs",
  "src/app/dev_fee.rs", "src/scheduler.rs",
]

# --- Settings variants (§ 4.5) -----------------------------------------------
#
# The stack runs Ortsom's own settings template, so a bug that only shows
# under another daemon configuration never ran: #1098 and #1099 both shipped
# with `ortsom:pass`. A variant restarts mostrod on the same stack with an
# overlay of that template (`ortsom stack restart-daemon --settings-overlay`,
# overlay format in Ortsom's docs/ci-regtest.md) and runs `scenarios` again,
# reported as `<scenario>@<variant>`. A variant runs when a changed file
# matches its `paths`, and every variant runs when the selection is full.
# A file only variants match (settings.tpl.toml) counts as covered.

[[variant]]
name = "price-pegged-only"
why = "a lone [price.providers.pegged], as the template's opt-in block reads (#1099)"
overlay = "variants/price-pegged-only.toml"
paths = ["src/price/**", "src/bitcoin_price.rs", "src/config/**", "settings.tpl.toml"]
scenarios = ["market_price_order"]

[[variant]]
name = "price-pegged-and-market"
why = "the pegged provider next to a market provider"
overlay = "variants/price-pegged-and-market.toml"
paths = ["src/price/**", "src/bitcoin_price.rs", "src/config/**", "settings.tpl.toml"]
scenarios = ["market_price_order"]

[[variant]]
name = "price-legacy"
why = "no [price] table: the legacy bitcoin_price_api_url of every pre-[price] settings.toml"
overlay = "variants/price-legacy.toml"
paths = ["src/price/**", "src/bitcoin_price.rs", "src/config/**", "settings.tpl.toml"]
scenarios = ["market_price_order"]

[[variant]]
name = "bond-hold-cltv-298"
why = "bonds on, hold_invoice_cltv_delta = 298 and no bond_cltv_delta (#1098)"
overlay = "variants/bond-hold-cltv-298.toml"
paths = ["src/app/bond/**", "src/lightning/**", "src/config/**", "settings.tpl.toml"]
scenarios = ["bond_released_on_success", "happy_sell"]

[[variant]]
name = "bond-cltv-at-limit"
why = "bond_cltv_delta at its floor, hold_invoice_cltv_delta + 145"
overlay = "variants/bond-cltv-at-limit.toml"
paths = ["src/app/bond/**", "src/lightning/**", "src/config/**", "settings.tpl.toml"]
scenarios = ["bond_released_on_success"]
